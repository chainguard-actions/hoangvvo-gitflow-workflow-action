name: Test dry run with version increment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          develop_branch: act-harness
          main_branch: act-harness
          version_increment: minor
          dry_run: "true"
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.version }}
          BRANCH: ${{ steps.action.outputs.release_branch }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          echo "release_branch: $BRANCH"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.0$'; then
              echo "FAIL: expected a minor-incremented semver (x.y.0), got '$VERSION'"
              exit 1
            fi
            if [ "$BRANCH" != "release/$VERSION" ]; then
              echo "FAIL: expected release_branch 'release/$VERSION'"
              exit 1
            fi
            echo "PASS: outputs correct"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
