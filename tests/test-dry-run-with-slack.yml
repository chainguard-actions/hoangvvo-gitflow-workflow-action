name: Test dry run with slack options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          develop_branch: develop
          main_branch: main
          version: 2.0.0
          dry_run: "true"
          slack: '{"channel":"#releases","username_mapping":{"octocat":"U12345"}}'
      - name: Assert outputs (or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.version }}
          BRANCH: ${{ steps.action.outputs.release_branch }}
          PULL: ${{ steps.action.outputs.pull_number }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION branch: $BRANCH pull: $PULL"
          if [ "$OUTCOME" = "success" ]; then
            [ "$VERSION" = "2.0.0" ] || { echo "FAIL: version"; exit 1; }
            [ "$BRANCH" = "release/2.0.0" ] || { echo "FAIL: release_branch"; exit 1; }
            [ -z "$PULL" ] || { echo "FAIL: dry run should not create PR"; exit 1; }
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
