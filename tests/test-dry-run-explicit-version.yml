name: Test dry run with explicit version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          develop_branch: act-harness
          main_branch: act-harness
          version: 1.2.3
          dry_run: "true"
          release_summary: "Test summary"
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.version }}
          BRANCH: ${{ steps.action.outputs.release_branch }}
          TYPE: ${{ steps.action.outputs.type }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          echo "release_branch: $BRANCH"
          echo "type: $TYPE"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$VERSION" != "1.2.3" ]; then
              echo "FAIL: expected version '1.2.3'"
              exit 1
            fi
            if [ "$BRANCH" != "release/1.2.3" ]; then
              echo "FAIL: expected release_branch 'release/1.2.3'"
              exit 1
            fi
            if [ "$TYPE" != "release" ]; then
              echo "FAIL: expected type 'release'"
              exit 1
            fi
            echo "PASS: outputs correct"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
