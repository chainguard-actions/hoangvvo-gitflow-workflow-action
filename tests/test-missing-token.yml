name: Test missing GITHUB_TOKEN env fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ""
        with:
          develop_branch: act-harness
          main_branch: act-harness
          version: 1.0.0
          dry_run: "true"
      - name: Assert action failed without token
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when GITHUB_TOKEN is not defined"
            exit 1
          fi
          if [ -n "$VERSION" ]; then
            echo "FAIL: no outputs expected"
            exit 1
          fi
          echo "PASS"
